<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator by gpt</title>
</head>
<style>
    /* ================================
   ULTRA MODERN NEON CALCULATOR
   ================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", "Segoe UI", sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #6c00ff 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #00eaff 0%, transparent 30%),
        linear-gradient(135deg, #080014, #0b1026 50%, #001b2e);

    overflow: hidden;
}

/* Decorative glowing background */

body::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: #7b00ff;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.25;
    top: -150px;
    left: -150px;
    animation: floatGlow 7s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: #00eaff;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.2;
    bottom: -150px;
    right: -100px;
    animation: floatGlow 6s ease-in-out infinite alternate-reverse;
}

/* Calculator */

.main {
    position: relative;
    z-index: 2;

    width: 350px;
    padding: 28px;

    border-radius: 30px;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255, 255, 255, 0.18);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);

    animation: calculatorIn 0.8s ease;
}

/* Top shine */

.main::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.7),
        transparent
    );
}

/* Display */

#blankfield {
    width: 100%;
    height: 75px;

    border: none;
    outline: none;

    border-radius: 18px;

    padding: 0 20px;

    font-size: 30px;
    font-weight: 600;
    text-align: right;

    color: #ffffff;

    background: rgba(0, 0, 0, 0.35);

    box-shadow:
        inset 0 5px 15px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(0, 234, 255, 0.08);

    border: 1px solid rgba(255, 255, 255, 0.08);

    margin-bottom: 8px;

    transition: 0.3s ease;
}

#blankfield:focus {
    border-color: rgba(0, 234, 255, 0.5);

    box-shadow:
        inset 0 5px 15px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(0, 234, 255, 0.25);
}

/* Placeholder-like empty display */

#blankfield:valid {
    color: #ffffff;
}

/* Button */

.btn {
    width: 70px;
    height: 58px;

    margin: 0 4px;

    border: none;
    outline: none;

    border-radius: 17px;

    color: #ffffff;
    background: rgba(255, 255, 255, 0.09);

    border: 1px solid rgba(255, 255, 255, 0.1);

    font-size: 20px;
    font-weight: 600;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    box-shadow:
        0 7px 15px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

/* Button shine */

.btn::before {
    content: "";

    position: absolute;
    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.18),
        transparent
    );

    transition: 0.5s;
}

.btn:hover::before {
    left: 100%;
}

/* Hover */

.btn:hover {
    transform: translateY(-4px) scale(1.04);

    background: rgba(255, 255, 255, 0.17);

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.3),
        0 0 15px rgba(0, 234, 255, 0.2);
}

/* Click */

.btn:active {
    transform: translateY(2px) scale(0.95);

    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.4);
}

/* Operators */

input[value="*"],
input[value="/"],
input[value="+"],
input[value="-"] {
    background: linear-gradient(
        135deg,
        rgba(117, 0, 255, 0.75),
        rgba(0, 153, 255, 0.65)
    );

    color: #ffffff;

    box-shadow:
        0 7px 20px rgba(92, 0, 255, 0.3);
}

input[value="*"]:hover,
input[value="/"]:hover,
input[value="+"]:hover,
input[value="-"]:hover {
    background: linear-gradient(
        135deg,
        #8a2be2,
        #00bfff
    );

    box-shadow:
        0 0 25px rgba(0, 200, 255, 0.5);
}

/* Equals */

input[value="="] {
    background: linear-gradient(
        135deg,
        #00eaff,
        #0077ff
    );

    color: #00111c;

    font-size: 24px;

    box-shadow:
        0 8px 25px rgba(0, 220, 255, 0.35);
}

input[value="="]:hover {
    background: linear-gradient(
        135deg,
        #38f5ff,
        #368aff
    );

    box-shadow:
        0 0 30px rgba(0, 234, 255, 0.7);
}

/* Decimal */

input[value="."] {
    color: #00eaff;
}

/* Clear button */

#clear1 {
    width: 148px;

    background: linear-gradient(
        135deg,
        #ff1744,
        #ff006e
    );

    color: white;

    font-size: 16px;

    box-shadow:
        0 8px 25px rgba(255, 0, 90, 0.3);
}

#clear1:hover {
    background: linear-gradient(
        135deg,
        #ff315d,
        #ff1780
    );

    box-shadow:
        0 0 30px rgba(255, 0, 100, 0.6);
}

/* Number buttons */

input[value="0"],
input[value="1"],
input[value="2"],
input[value="3"],
input[value="4"],
input[value="5"],
input[value="6"],
input[value="7"],
input[value="8"],
input[value="9"] {
    color: #eafaff;
}

/* Form spacing */

form {
    text-align: center;
}

/* Remove ugly default form spacing effects */

br {
    user-select: none;
}

/* ================================
   ANIMATIONS
   ================================ */

@keyframes calculatorIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes floatGlow {
    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(60px, 40px) scale(1.2);
    }
}

/* ================================
   MOBILE
   ================================ */

@media (max-width: 420px) {

    .main {
        width: 92%;
        max-width: 350px;
        padding: 22px;
    }

    .btn {
        width: 62px;
        height: 54px;

        margin: 0 3px;

        border-radius: 15px;

        font-size: 18px;
    }

    #clear1 {
        width: 130px;
    }

    #blankfield {
        height: 68px;
        font-size: 26px;
    }
}

@media (max-width: 340px) {

    .main {
        padding: 17px;
    }

    .btn {
        width: 55px;
        height: 50px;

        margin: 0 2px;
    }

    #clear1 {
        width: 116px;
    }
}

</style>
<body>
     <div class="main">
        <form name="forms">
            <input type="text" name="n" id="blankfield">
            <br><br>
            <input type="button" value="9" class="btn" onclick="forms.n.value +='9'">
            <input type="button" value="8" class="btn" onclick="forms.n.value +='8'">
            <input type="button" value="7" class="btn" onclick="forms.n.value +='7'">
            <br><br>
            
            <input type="button" value="6" class="btn" onclick="forms.n.value +='6'">
            <input type="button" value="5" class="btn" onclick="forms.n.value +='5'">
            <input type="button" value="4" class="btn" onclick="forms.n.value +='4'">
            <br><br>

            <input type="button" value="3" class="btn" onclick="forms.n.value +='3'">
            <input type="button" value="2" class="btn" onclick="forms.n.value +='2'">
            <input type="button" value="1" class="btn" onclick="forms.n.value +='1'">
            <br><br>

            <input type="button" value="*" class="btn" onclick="forms.n.value +='*'">
            <input type="button" value="/" class="btn" onclick="forms.n.value +='/'">
            <input type="button" value="+" class="btn" onclick="forms.n.value +='+'">
            <br><br>

            <input type="button" value="-" class="btn" onclick="forms.n.value +='-'">
            <input type="button" value="." class="btn" onclick="forms.n.value +='.'">
            <input type="button" value="=" class="btn" onclick="forms.n.value = eval(forms.n.value)">
            <br><br>

            <input type="button" value="0" class="btn" onclick="forms.n.value +='0'">
            <input type="button" value="Clear" class="btn" id="clear1" onclick="forms.n.value=''">
        </form>
    </div>
</body>
</html>
